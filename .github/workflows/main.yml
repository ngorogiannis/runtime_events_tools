name: main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - 5.0
          - 5.1
          - 5.2
          - 5.3
          - 5.4
          - 5.5
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
        exclude:
          # olly reads a child's ring buffer through an out-of-process cursor,
          # which cannot be created at all on Windows before OCaml 5.3: the
          # consumer built the path with a UTF-8 string and a wide format
          # string, and so looked for a garbled file name. Fixed by
          # ocaml/ocaml#13089.
          - os: windows-latest
            ocaml-compiler: 5.0
          - os: windows-latest
            ocaml-compiler: 5.1
          - os: windows-latest
            ocaml-compiler: 5.2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          opam-pin: false
          ocaml-compiler: ${{ matrix.ocaml-compiler }}


      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - run: opam exec -- dune runtest

      - run: |
          opam install . --with-dev-setup --with-test --deps-only
          opam exec -- dune build @fmt

  build-freebsd:
    # No native FreeBSD runner exists on GitHub Actions, so this boots one
    # under QEMU. FreeBSD's pkg repo only carries OCaml 4.14, so opam builds
    # the compiler from source; cache-after-prepare snapshots the VM once
    # that's done.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          cache-after-prepare: true
          prepare: |
            # opam-hash=${{ hashFiles('*.opam') }} (invalidates the cached
            # image above when dependency constraints change)
            export OPAMYES=1
            pkg install -y ocaml-opam
            opam init --bare
            # Pin an exact released version as opam has no OCaml 5.x FreeBSD
            # package to fall back to.
            opam switch create 5.5.1
            opam install . --deps-only --with-test
          run: |
            opam exec -- dune build
            opam exec -- dune runtest
